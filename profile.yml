featured:
  show: true
  name: Manufacturing Costing Engine
  label: Built at work · a working system
  link: https://github.com/abhishekvtiwari/manufacturing-costing-engine
  pitch: "What I do best: take a process that runs on a fragile spreadsheet and turn it into a system people can trust. This is the clearest example."
  before_after:
    - ["Product costs partly typed in by hand in one large Excel sheet", "Every cost derived from raw-material prices and recipes, never typed"]
    - ["A price change meant hunting through every product that used it", "Change one price and every affected product recalculates at once"]
    - ["\"What if this price goes up?\" meant copying the sheet and editing it by hand", "Impact analysis shows every affected product, old cost against new, before anything is saved"]
    - ["Nobody could say who changed a number, when, or why", "Every change logged with who, when, old value, new value and the reason"]
    - ["No checks: a recipe could total 99.5% or a bad paste could slip in unnoticed", "Recipes must total 100%, uploads are checked all-or-nothing, six user roles, 62 automated tests"]
  images:
    - [portfolio/projects/costing-engine/images/home.jpg, "Search & overview: what a product costs today, and what moved"]
    - [portfolio/projects/costing-engine/images/grade.jpg, "One product's full cost build-up"]
    - [portfolio/projects/costing-engine/images/impact.jpg, "What-if: a price change and every product it touches"]
    - [portfolio/projects/costing-engine/images/sheet.jpg, "The familiar costing sheet, now live"]
    - [portfolio/projects/costing-engine/images/activity.jpg, "Audit trail: who changed what, and why"]
  stack: Python · FastAPI · SQLAlchemy · PostgreSQL · openpyxl · pytest
  note: Screenshots use made-up demo data. The company's products, customers and prices are not shown.

