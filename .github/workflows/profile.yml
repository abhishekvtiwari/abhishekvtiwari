# Rebuilds the terminal-style images on the profile once a day from the
# public contribution calendar, and commits them only when they changed.
name: Refresh profile images
on:
  schedule:
    - cron: "30 0 * * *"     # 06:00 India time, every day
  workflow_dispatch:          # and on demand from the Actions tab
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_profile.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "Refresh profile images" && git push)
