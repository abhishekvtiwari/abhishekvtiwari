# Rebuilds the profile page from profile.yml: every morning (for the
# contribution heatmap and stats) and whenever profile.yml, the resume or the
# certificates change. Commits only when something actually changed.
name: Refresh profile
on:
  schedule:
    - cron: "30 0 * * *"      # 06:00 India time, every day
  push:
    branches: [main]
    paths:
      - profile.yml
      - resume/**
      - certificates/**
      - scripts/**
  workflow_dispatch:           # "Run workflow" button in the Actions tab
permissions:
  contents: write
concurrency:
  group: refresh-profile
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python scripts/build_profile.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || (git commit -m "Refresh profile" && git push)
